name: Crear el APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Meter el juego dentro de la app
        run: |
          mkdir -p android/app/src/main/assets
          cp -r juego android/app/src/main/assets/

      - name: Poner la llave de firma
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/release.jks

      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('prueba-{0}', github.run_number) }}
        run: gradle assembleRelease --no-daemon

      - name: Nombre bonito
        run: cp android/app/build/outputs/apk/release/app-release.apk "PitiPauseRush.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PitiPauseRush-apk
          path: PitiPauseRush.apk

      - name: Publicar en Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PitiPauseRush.apk
          name: Piti-Pause Rush ${{ github.ref_name }}
          body: |
            🚬☕ Piti-Pause Rush ${{ github.ref_name }}
            Descarga **PitiPauseRush.apk**, ábrelo en el móvil y acepta «instalar apps de origen desconocido».
